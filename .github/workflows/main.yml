{"name": "Compilar APKs",
"on": {"push": {"branches": ["main"]}, "workflow_dispatch": {}},
"permissions": {"contents": "write"},
"jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [
{"uses": "actions/checkout@v4"},
{"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}},
{"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.9"}},
{"name": "Compilar servidor e cliente", "run": "set -o pipefail\ngradle :server:assembleRelease :client:assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log\n"},
{"name": "Renomear APKs", "id": "apks", "run": "VERSION=$(grep '^appVersionName=' gradle.properties | cut -d= -f2)\nmkdir -p saida\ncp server/build/outputs/apk/release/*.apk \"saida/ensaios-servidor-$VERSION.apk\"\ncp client/build/outputs/apk/release/*.apk \"saida/ensaios-cliente-$VERSION.apk\"\necho \"version=$VERSION\" >> \"$GITHUB_OUTPUT\"\nls -la saida\n"},
{"uses": "actions/upload-artifact@v4", "with": {"name": "apks-${{ steps.apks.outputs.version }}-build${{ github.run_number }}", "path": "saida/*.apk"}},
{"name": "Publicar na página de versões (Releases)", "uses": "softprops/action-gh-release@v2", "with": {"tag_name": "v${{ steps.apks.outputs.version }}-build${{ github.run_number }}", "name": "Versão ${{ steps.apks.outputs.version }} (build ${{ github.run_number }})", "body": "Veja o que mudou no CHANGELOG.md.", "files": "saida/*.apk"}}
]}}}
